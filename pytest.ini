[pytest]
# Run with `pytest` from the repo root or from backend/.
testpaths = backend/tests
# backend -> "import app...", database/ocr -> the OCR parser's flat imports ("from money import ...")
pythonpath = backend database/ocr
# Skipped by default:
#   lmstudio - needs a real LM Studio server running   (run with: pytest -m lmstudio)
#   fuzz     - slower automatic API fuzzing            (run with: pytest -m fuzz)
addopts = -ra -m "not lmstudio and not fuzz"
markers =
    lmstudio: manual integration tests that call a real LM Studio server (run with: pytest -m lmstudio)
    fuzz: automatic API fuzzing with Schemathesis (run with: pytest -m fuzz)
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source = backend/app
