[pytest]
# Run with `pytest` from the repo root or from backend/.
testpaths = backend/tests
# backend -> "import app...", database/ocr -> the OCR parser's flat imports ("from money import ...")
pythonpath = backend database/ocr
addopts = -ra -m "not lmstudio"
filterwarnings =
    ignore::DeprecationWarning
markers =
    lmstudio: manual integration tests that call a real LM Studio server (run with: pytest -m lmstudio)
